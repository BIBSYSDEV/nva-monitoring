AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Template stack for NVA monitoring

Globals:
  Function:
    Architectures:
      - arm64
    MemorySize: 1800
    Runtime: java21
    Environment:
      Variables:
        LOG_LEVEL: "info"
        LOG4J_CONFIGURATION_FILE: classpath:nva-log4j2.xml

Parameters:
  NvaMonitoringDashBoardName:
    Type: "String"
    Default: "NvaMonitoringDashboard"
    Description: Name monitoring dashboard that will be updated by this lambda
  SlackSnsArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/NVA/Monitoring/SlackSnsArn"

Conditions:
  # AWS::InspectorV2::Filter resources fail to deploy where it is not enabled. Currently only
  # sikt-nva-sandbox. Extend with !Or when more accounts are enabled.
  InspectorEnabled: !Equals [!Ref "AWS::AccountId", "750639270376"]

Resources:
  UpdateDashboardHandlerLogGroup:
    Type: "AWS::Logs::LogGroup"
    Properties:
      RetentionInDays: 30
      LogGroupName: !Join ["", ["/aws/lambda/", !Ref UpdateDashboardHandler]]

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole

  DefaultLambdaPermissions:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub DefaultLambdaPermissions-${AWS::StackName}
      Roles:
        - !Ref LambdaRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogGroups
              - lambda:InvokeFunction
              - lambda:ListFunctions
            Resource: "*"

  CloudWatchPermissions:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub CloudWatchPermissions-${AWS::StackName}
      Roles:
        - !Ref LambdaRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:GetDashboard
              - cloudwatch:PutDashboard
              - cloudwatch:DescribeAlarms
            Resource: "*"

  ApiGatewayPermissions:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ApiGatewayPermissions-${AWS::StackName}
      Roles:
        - !Ref LambdaRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - Apigateway:GET
            Resource: "*"

  UpdateDashboardHandler:
    Type: AWS::Serverless::Function
    DependsOn:
      - DefaultLambdaPermissions
      - CloudWatchPermissions
      - ApiGatewayPermissions
    Properties:
      CodeUri: dashboard
      Handler: no.sikt.nva.monitoring.UpdateDashboardHandler::handleRequest
      Timeout: 900
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          DASHBOARD_NAME: !Sub "${NvaMonitoringDashBoardName}-${AWS::AccountId}"
      Events:
        StackEvent:
          Type: CloudWatchEvent
          Properties:
            Pattern:
              source:
                - "aws.cloudformation"
              detail-type:
                - "AWS API Call via CloudTrail"
              detail:
                eventSource:
                  - "cloudformation.amazonaws.com"
                eventName:
                  - "CreateStack"
                  - "UpdateStack"
                  - "DeleteStack"

  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${NvaMonitoringDashBoardName}-${AWS::AccountId}"
      DashboardBody: '{"widgets":[]}'

  CostAnomalySubscription:
    Type: "AWS::CE::AnomalySubscription"
    Properties:
      Frequency: "IMMEDIATE"
      MonitorArnList:
        - !Ref CostAnomalyMonitor
      Subscribers:
        - Address: !Ref SlackSnsArn
          Type: "SNS"
      ThresholdExpression: '{
        "And": [
        {
        "Dimensions": {
        "Key": "ANOMALY_TOTAL_IMPACT_PERCENTAGE",
        "MatchOptions": [ "GREATER_THAN_OR_EQUAL" ],
        "Values": [ "70" ]
        }
        },
        {
        "Dimensions": {
        "Key": "ANOMALY_TOTAL_IMPACT_ABSOLUTE",
        "MatchOptions": [ "GREATER_THAN_OR_EQUAL" ],
        "Values": [ "50" ]
        }
        }
        ]
        }'
      SubscriptionName: "Cost Anomaly Subscription"

  InspectorFindingEventRule:
    Type: "AWS::Events::Rule"
    Properties:
      Description: "Forward active CRITICAL Inspector findings to Slack"
      EventPattern:
        source:
          - "aws.inspector2"
        detail-type:
          - "Inspector2 Finding"
        detail:
          severity:
            - "CRITICAL"
          status:
            - "ACTIVE"
      Targets:
        - Id: "SlackSnsTopic"
          Arn: !Ref SlackSnsArn
          # AWS Chatbot drops SNS messages it does not recognize, so the event is
          # rewritten to Chatbot's custom notification schema before publishing.
          InputTransformer:
            InputPathsMap:
              severity: "$.detail.severity"
              title: "$.detail.title"
              resource: "$.detail.resources[0].id"
            InputTemplate: |
              {
                "version": "1.0",
                "source": "custom",
                "content": {
                  "textType": "client-markdown",
                  "title": ":rotating_light: Inspector finding (<severity>)",
                  "description": "<title>\nResource: `<resource>`"
                }
              }

  InspectorDigestHandlerLogGroup:
    Type: "AWS::Logs::LogGroup"
    Properties:
      RetentionInDays: 30
      LogGroupName: !Join ["", ["/aws/lambda/", !Ref InspectorDigestHandler]]

  InspectorDigestPermissions:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub InspectorDigestPermissions-${AWS::StackName}
      Roles:
        - !Ref LambdaRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - inspector2:ListFindings
            Resource: "*"
          - Effect: Allow
            Action:
              - sns:Publish
            Resource: !Ref SlackSnsArn

  InspectorDigestHandler:
    Type: AWS::Serverless::Function
    DependsOn:
      - DefaultLambdaPermissions
      - InspectorDigestPermissions
    Properties:
      CodeUri: inspector-digest
      Handler: no.sikt.nva.monitoring.InspectorDigestHandler::handleRequest
      Timeout: 300
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          # Must cover the WeeklyDigest schedule interval below plus one hour
          # of margin (7 * 24 + 1), or findings can miss their digest.
          NEW_FINDING_MAX_AGE_HOURS: "169"
          SLACK_SNS_TOPIC_ARN: !Ref SlackSnsArn
      Events:
        WeeklyDigest:
          Type: Schedule
          Properties:
            # Changing the frequency requires adjusting NEW_FINDING_MAX_AGE_HOURS above.
            Schedule: "cron(0 6 ? * MON *)"
            Description: "Weekly digest of active HIGH and CRITICAL Inspector package vulnerability findings"

  # Suppressions of accepted findings. One resource per CVE, each with the reason and
  # the condition for removing it in the Description.
  SuppressNettySniBypassFinding:
    Type: AWS::InspectorV2::Filter
    Condition: InspectorEnabled
    Properties:
      Name: "Suppress CVE-2026-75595 (Netty SNI bypass)"
      Description: >-
        netty-handler is only bundled as the AWS SDK async HTTP transport. Our Lambdas
        never run a Netty TLS server, so the vulnerable SslClientHelloHandler is
        unreachable. Remove when netty-nio-client is excluded from the builds or
        netty is >= 4.1.137.
      FilterAction: SUPPRESS
      FilterCriteria:
        VulnerabilityId:
          - Comparison: EQUALS
            Value: CVE-2026-75595

  CostAnomalyMonitor:
    Type: "AWS::CE::AnomalyMonitor"
    Properties:
      MonitorName: "Cost Anomaly Monitor"
      MonitorType: "DIMENSIONAL"
      MonitorDimension: "SERVICE"

  CloudWatchAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: "CostAnomalyAlarm"
      AlarmDescription: "Alarm for Cost Anomaly Detection"
      MetricName: "AnomalyDetection"
      Namespace: "AWS/CostExplorer"
      Statistic: "Maximum"
      Period: 600 # Check every 10 minutes
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
